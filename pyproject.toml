[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"


[project]
name = "ratatosk"
version = "0.1.0"
authors = [
  { name = "Nik Reeves-McLaren", email = "nik.reeves-mclaren@sheffield.ac.uk"},
  { name = "Neil Shephard", email = "n.shephard@sheffield.ac.uk" },
]
description = "Validated electrochemical data-processing, analysis and integrity tool for battery research."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "joblib>=1.6",
  "lmfit>=1.3",
  "matplotlib>=3.11",
  "numpy>=2.5",
  "python-calamine>=0.8",
  "psutil>=7.2",
  "scipy>=1.18",
  "seaborn>=0.13",
]

[project.urls]
Homepage = "https://github.com/yggdrasil-materials/ratatosk"
"Bug Tracker" = "https://github.com/yggdrasil-materials/ratatosk/issues"
Discussions = "https://github.com/yggdrasil-materials/ratatosk/discussions"
Changelog = "https://github.com/yggdrasil-materials/ratatosk/releases"


[dependency-groups]
docs = [
  "zensical>=0.0.63",
]
tests = [
  "pytest >=9.1",
  "pytest-cov >=7",
  "pytest-loguru>=0.4",
  "pytest-mpl>=0.19",
  "pytest-testmon>=2.2",
  "pytest-xdist>=3.8",
  "syrupy>=6.1.1",
]
notebooks = [
  "jupyter>=1.1",
  "marimo>=0.24",
]
dev = [
  { include-group = "docs" },
  { include-group = "notebooks" },
  { include-group = "tests" },
  "black>=26.5",
  "codespell>=2.4",
  "ipdb>=0.13",
  "mypy>=2.3",
  "pre-commit>=4.6",
  "pylint>=4.0",
  "ruff>=0.16",
  "scipy-stubs>=1.18",
  "ty>=0.0.82",
]


[tool.pytest]
minversion = "9.1"
addopts = ["-ra", "--showlocals", "--cov"]
strict = true
filterwarnings = [
  "error",
]
log_level = "INFO"
testpaths = [
  "tests",
]


[tool.codespell]
skip = 'uv.lock'
count = ''
quiet-level = 3
# ignore-words-list = ''

[tool.coverage]
run.source = ["ratatosk"]
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.14"
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "ratatosk.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true


[tool.ruff]
show-fixes = true

[tool.ruff.lint]
extend-select = [
  "ARG",    # flake8-unused-arguments
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "EM",     # flake8-errmsg
  "EXE",    # flake8-executable
  "FURB",   # refurb
  "G",      # flake8-logging-format
  "ICN",    # flake8-import-conventions
  "ISC",    # flake8-implicit-str-concat
  "LOG",    # flake8-logging
  "NPY",    # NumPy specific rules
  "PD",     # pandas-vet
  "PERF",   # perflint
  "PGH",    # pygrep-hooks
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific
  "SIM",    # flake8-simplify
  "SLOT",   # flake8-slots
  "T10",    # flake8-debugger
  "T20",    # flake8-print
  "TC",     # flake8-type-checking
  "TRY",    # tryceratops
  "UP",     # pyupgrade
]
ignore = [
  "PLR09",    # Too many <...>
  "PLR2004",  # Magic value used in comparison
]
# Uncomment if using a _compat.typing backport
# typing-modules = ["ratatosk._compat.typing"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"noxfile.py" = ["T20"]
"docs/examples/**" = ["T20"]


[tool.pylint]
py-version = "3.14"
ignore-paths = [".*/_version.py"]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "design",
  "fixme",
  "line-too-long",
  "missing-module-docstring",
  "missing-function-docstring",
  "wrong-import-position",
]

[tool.ty.rules]
possibly-unresolved-reference = "warn"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.numpydoc_validation]
checks = [
  "all", # Perform all check except those listed below
  "ES01",
  "EX01",
  "PR10", # Conflicts with black formatting
  "SA01",
]
exclude = [  # don't report on objects that match any of these regex
    "\\.undocumented_method$",
    "\\.__repr__$",
    "^test_",
    "^conftest",
    "^conf$",
    "^noxfile.py$",
]
override_SS05 = [  # override SS05 to allow docstrings starting with these words
    "^Process ",
    "^Assess ",
    "^Access ",
]
